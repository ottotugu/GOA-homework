<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>RGB ფერები და მაგალითები</title>
    <style>
        body {
            background-color: rgb(128, 64, 192); 
            color: white;
           
        }


        .hover-box {
            background-color: rgb(200, 200, 200);
        }

        .hover-box:hover {
            background-color: rgb(255, 100, 100);
        }
    </style>
</head>
<body>
    

    <div class="color-box" style="color: rgb(128, 64, 192);"></div>
    <p>იისფერი</p>

    <div class="color-box" style="color: rgb(255, 0, 0);"></div>
    <p> წითელი</p>

    <div class="color-box" style="color: rgb(0, 255, 0);"></div>
    <p> მწვანე</p>

    <div class="color-box" style="color: rgb(0, 0, 255);"></div>
    <p>ლურჯი</p>

    <div class="color-box" style="color: rgb(255, 255, 0);"></div>
    <p>ყვითელი</p>

    <div class="color-box" style="color: rgb(0, 255, 255);"></div>
    <p> ცისფერი</p>

    <div class="color-box" style="color: rgb(255, 0, 255);"></div>
    <p>იისფერი </p>

   
    <div class="color-box" style="color: rgb(255, 0, 0);"></div>
    <p>წითელი </p>

    <div class="color-box" style="color: rgb(0, 255, 0);"></div>
    <p>მწვანე </p>

    <div class="color-box" style="color: rgb(0, 0, 255);"></div>
    <p>ლურჯი</p>

    
    <div class="color-box hover-box"></div>
    <p>მაუსის გადატარებაზე იცვლება ფერი: rgb(255, 100, 100)</p>

</body>
</html>
